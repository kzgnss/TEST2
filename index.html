<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VIP Predictor</title>
  <style>
    :root{
      --bg:#0b0f1a;
      --card:#0f1626;
      --text:#eef2ff;
      --muted:rgba(238,242,255,.72);
      --border:rgba(255,255,255,.10);
      --a:#7c5cff;
      --b:#35d0ba;
      --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(900px 520px at 80% -10%, rgba(124,92,255,.26), transparent 55%),
        radial-gradient(820px 520px at 10% 0%, rgba(53,208,186,.18), transparent 55%),
        var(--bg);
      color:var(--text);
      display:flex;min-height:100vh;
      align-items:center;justify-content:center;
      padding:18px;
    }
    .card{
      width:min(520px, 100%);
      background:rgba(255,255,255,.03);
      border:1px solid var(--border);
      border-radius:var(--r);
      padding:18px;
    }
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      margin-bottom:10px;
    }
    .brand{font-weight:900;letter-spacing:.2px}
    .tag{
      font-size:12px;color:var(--muted);
      border:1px solid var(--border);
      padding:6px 10px;border-radius:999px;
      background:rgba(255,255,255,.02);
      white-space:nowrap;
    }
    h1{margin:0 0 8px;font-size:22px;line-height:1.2}
    .sum{
      margin:0 0 12px;
      font-size:44px;font-weight:950;line-height:1;
      background:linear-gradient(135deg,var(--b),var(--a));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .txt{margin:0 0 14px;color:var(--muted);font-size:13.5px}
    .btns{display:grid;gap:10px}
    a,button{font:inherit}
    .btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      padding:12px 14px;border-radius:14px;
      text-decoration:none;
      font-weight:900;
      border:0;cursor:pointer;
    }
    .deposit{
      background:linear-gradient(135deg,var(--a),#5a8cff);
      color:white;
    }
    .tg{
      background:rgba(255,255,255,.04);
      color:var(--text);
      border:1px solid var(--border);
    }
    .fine{
      margin:12px 0 0;
      color:rgba(238,242,255,.58);
      font-size:11.5px;
      line-height:1.45;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="brand">VIP Predictor</div>
      <div class="tag">🇪🇬 18+</div>
    </div>

    <h1>اعمل إيداع على حسابك</h1>
    <div class="sum">230 EGP</div>

    <p class="txt">
      بعد الإيداع، ابعت إثبات (سكرينشوت) على تيليجرام عشان نفعّل وصول VIP.
    </p>

    <div class="btns">
      <!-- رابط صفحة الإيداع -->
      <a class="btn deposit" href="PUT_YOUR_DEPOSIT_LINK_HERE" target="_blank" rel="noopener">
        روح لصفحة الإيداع 💳
      </a>

      <!-- رابط تيليجرام للدعم/بوت -->
      <a class="btn tg" href="https://t.me/PUT_YOUR_BOT_OR_SUPPORT" target="_blank" rel="noopener">
        ابعت إثبات الإيداع على تيليجرام ↗
      </a>
    </div>

    <p class="fine">
      مفيش ضمان ربح. ده محتوى/أداة مساعدة (تحليل/إشارات) والنتائج بتختلف. التزم بالقوانين المحلية وشروط المنصة.
    </p>
  </div>
</body>
</html>
